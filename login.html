<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Gaon Pradhan Certificate Portal</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h2>Gaon Pradhan Portal</h2>

        <p>Please Login</p>

        <input
            type="text"
            id="username"
            placeholder="Username">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button onclick="login()" class="btn">
            Login
        </button>

        <p id="message"></p>

    </div>

</div>

<script src="js/auth.js"></script>

</body>
</html>
