<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificate Preview</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="certificate">

<h1>OFFICE OF THE GAON PRADHAN</h1>

<h2>GRAM PANCHAYAT</h2>

<hr>

<h3>CERTIFICATE</h3>

<p><strong>Certificate No:</strong> <span id="certificateNo"></span></p>

<p style="margin-top:30px;line-height:2">

This is to certify that

<strong id="name"></strong>

Son/Daughter of

<strong id="father"></strong>

Village

<strong id="village"></strong>

Police Station

<strong id="ps"></strong>

District

<strong id="district"></strong>

is a permanent resident of this Gram Panchayat.

</p>

<br><br>

<p>
Date :
<span id="date"></span>
</p>

<br><br><br>

<div class="signature">

<div>

____________________

<br>

Gaon Pradhan

</div>

</div>

</div>

<script src="js/certificate.js"></script>

</body>
</html>
