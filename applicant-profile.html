<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        My Profile | Gaon Pradhan Portal
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header class="header">

    <img
        src="assets/logo.png"
        class="logo"
    >

    <div>

        <h1>
            Gaon Pradhan Certificate Portal
        </h1>

        <p>
            Applicant Profile
        </p>

        <p id="userEmail"></p>

    </div>

</header>



<div class="dashboard">


    <div class="card">

        <h2>
            My Profile
        </h2>

        <p id="profileStatus">
            Profile Status: Loading...
        </p>


        <form id="profileForm">


            <!-- ========================= -->
            <!-- PERSONAL INFORMATION -->
            <!-- ========================= -->

            <h3>
                Personal Information
            </h3>


            <label>
                Full Name
            </label>

            <input
                type="text"
                id="fullName"
                required
            >


            <label>
                Father's Name
            </label>

            <input
                type="text"
                id="fatherName"
                required
            >


            <label>
                Mother's Name
            </label>

            <input
                type="text"
                id="motherName"
                required
            >


            <label>
                Date of Birth
            </label>

            <input
                type="date"
                id="dateOfBirth"
                required
            >


            <label>
                Gender
            </label>

            <select
                id="gender"
                required
            >

                <option value="">
                    Select Gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <label>
                Mobile Number
            </label>

            <input
                type="tel"
                id="mobile"
                maxlength="10"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                readonly
            >


            <!-- ========================= -->
            <!-- ADDRESS -->
            <!-- ========================= -->

            <h3>
                Address
            </h3>


            <label>
                Full Address
            </label>

            <textarea
                id="address"
                rows="4"
                required
            ></textarea>


            <label>
                Village / Town
            </label>

            <input
                type="text"
                id="villageTown"
                required
            >


            <label>
                Post Office
            </label>

            <input
                type="text"
                id="postOffice"
                required
            >


            <label>
                Police Station
            </label>

            <input
                type="text"
                id="policeStation"
                required
            >


            <label>
                District
            </label>

            <input
                type="text"
                id="district"
                required
            >


            <label>
                PIN Code
            </label>

            <input
                type="text"
                id="pinCode"
                maxlength="6"
                required
            >


            <!-- ========================= -->
            <!-- DOCUMENTS -->
            <!-- ========================= -->

            <h3>
                Documents
            </h3>


            <label>
                Passport Photo
            </label>

            <input
                type="file"
                id="passportPhoto"
                accept="image/jpeg,image/png"
            >


            <small>
                JPG or PNG only.
            </small>


            <br><br>


            <label>
                Aadhaar Card
            </label>

            <input
                type="file"
                id="aadhaarCard"
                accept="image/jpeg,image/png,application/pdf"
            >


            <small>
                JPG, PNG or PDF.
            </small>


            <br><br>


            <button
                type="submit"
                class="btn"
            >
                Save Profile
            </button>


        </form>


        <p id="profileMessage"></p>


    </div>


    <br>


    <a
        href="applicant-dashboard.html"
        class="btn"
    >
        Back to Dashboard
    </a>


    <button
        class="btn"
        onclick="logout()"
    >
        Logout
    </button>


</div>



<script
    type="module"
    src="js/applicant-profile.js"
></script>


</body>

              </html>
