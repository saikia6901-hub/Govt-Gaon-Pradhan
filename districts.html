<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>District Management | Gaon Pradhan Portal</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header class="header">

    <img
        src="assets/logo.png"
        class="logo"
    >

    <div>

        <h1>Gaon Pradhan Certificate Portal</h1>

        <p>District Management</p>

        <p id="adminEmail"></p>

    </div>

</header>


<main class="dashboard">

    <h2>District Management</h2>

    <p>
        Manage Assam District Master Data
    </p>


    <!-- ADD DISTRICT -->

    <div class="card">

        <h3>Add District</h3>

        <form id="districtForm">

            <input
                type="text"
                id="districtName"
                placeholder="District Name"
                required
            >

            <input
                type="text"
                id="districtCode"
                placeholder="District Code"
                required
            >

            <select id="districtStatus">

                <option value="active">
                    Active
                </option>

                <option value="inactive">
                    Inactive
                </option>

            </select>

            <button
                type="submit"
                class="btn"
            >
                Add District
            </button>

        </form>

    </div>


    <br>


    <!-- OFFICIAL IMPORT -->

    <div class="card">

        <h3>Official District Data</h3>

        <p>
            Import the official Assam district master list.
        </p>

        <button
            type="button"
            class="btn"
            id="importDistrictsBtn"
        >
            Import Official Districts
        </button>

        <p id="importStatus"></p>

    </div>


    <br>


    <!-- DISTRICT LIST -->

    <div class="card">

        <h3>District List</h3>

        <div id="districtList">

            <p>
                Loading districts...
            </p>

        </div>

    </div>


    <br>


    <button
        class="btn"
        onclick="window.location.href='admin-dashboard.html'"
    >
        Back to Admin Dashboard
    </button>


    <button
        class="btn"
        onclick="logout()"
    >
        Logout
    </button>

</main>


<!-- EDIT DISTRICT MODAL -->

<div
    id="editModal"
    style="
        display:none;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,0.6);
        padding:20px;
        z-index:9999;
    "
>

    <div
        class="card"
        style="
            max-width:500px;
            margin:80px auto;
        "
    >

        <h3>Edit District</h3>

        <input
            type="hidden"
            id="editDistrictId"
        >

        <input
            type="text"
            id="editDistrictName"
            placeholder="District Name"
        >

        <br><br>

        <input
            type="text"
            id="editDistrictCode"
            placeholder="District Code"
        >

        <br><br>

        <select id="editDistrictStatus">

            <option value="active">
                Active
            </option>

            <option value="inactive">
                Inactive
            </option>

        </select>

        <br><br>

        <button
            class="btn"
            id="saveEditBtn"
        >
            Save Changes
        </button>

        <button
            class="btn"
            id="cancelEditBtn"
        >
            Cancel
        </button>

    </div>

</div>


<script
    type="module"
    src="js/districts.js"
></script>

</body>

</html>
